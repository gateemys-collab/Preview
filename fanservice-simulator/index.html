:55px;background:radial-gradient(ellipse at 7% 80%,#101529 0 21px,transparent 22px),radial-gradient(ellipse at 23% 70%,#0d1325 0 26px,transparent 27px),radial-gradient(ellipse at 43% 85%,#101529 0 29px,transparent 30px),radial-gradient(ellipse at 65% 75%,#0c1326 0 25px,transparent 26px),radial-gradient(ellipse at 86% 70%,#0b1326 0 30px,transparent 31px);pointer-events:none}.idol{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);width:108px;height:160px;image-rendering:pixelated;filter:drop-shadow(0 5px 8px #050915)}.idol svg{width:100%;height:100%;image-rendering:pixelated}.idol.anim{animation:bop .32s ease-out}@keyframes bop{50%{transform:translateX(-50%) translateY(-13px) rotate(-4deg)}}.stage.home-stage{height:43dvh;min-height:280px;margin:28px 0 22px}.home-stage .idol{width:128px;height:190px}.statbar{background:#202d4a;border:1px solid #6e81b3;border-radius:10px;padding:12px;display:flex;justify-content:space-between;margin-bottom:12px}.pink{color:var(--pink)}.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 12px;font-weight:800;font-size:16px;margin-top:12px;background:linear-gradient(115deg,#f8c9df,#ee9ec8);color:#17213b}.btn.secondary{border:1px solid #8fa4d4;color:#f2f3ff;background:#18243f}.btn.small{font-size:14px;padding:12px}.foot{margin-top:auto;text-align:center;color:#a4b4d6;font-size:11px;padding-top:20px}.header{font-size:18px;font-weight:750;text-align:center}.tabs{display:flex;gap:6px;overflow:auto;padding:12px 0;scrollbar-width:none}.tabs button{white-space:nowrap;background:#223250;border:1px solid #52678f;color:#dfe7ff;border-radius:8px;padding:10px 13px}.tabs button.on{background:#f2b2d1;color:#1b2741;border-color:#f2b2d1}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;overflow:auto;padding:8px 0 14px}.opt{background:#263653;border:1px solid #6a7ea6;border-radius:10px;min-height:68px;color:#e4ebff;padding:8px 3px;font-size:12px}.opt.on{border:2px solid #f1a4cc;background:#3c3e65}.nameinput{width:100%;border:1px solid #6b80aa;border-radius:10px;background:#243450;color:white;padding:13px;margin:8px 0}.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px;font-size:13px}.hud b{font-size:17px}.timer{text-align:right;font-size:12px;color:#d7e0fb;margin-bottom:6px}.game-stage{height:30dvh;min-height:180px;max-height:280px}.game-stage .idol{width:100px;height:150px}.event{position:absolute;top:10px;left:50%;transform:translateX(-50%);border:1px solid #ffb5d7;background:#a54483cc;border-radius:20px;padding:5px 12px;font-size:12px;white-space:nowrap;display:none}.event.show{display:block}.signzone{position:relative;flex:1;min-height:160px;max-height:245px;margin:8px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:7px;overflow:auto}.sign{position:relative;color:#25304b;background:#f3eefa;border:2px solid #d2b8dc;border-radius:7px;padding:9px 7px 7px;min-height:67px;text-align:center;box-shadow:0 5px 0 #a2a3c544;font-weight:700;font-size:13px}.sign.ledsign{background:#252b56;color:#ffd0ec;border:2px solid #f3a8d0;text-shadow:0 0 6px #f4b3d8}.sign.banner{background:#d6e6ff;border-radius:4px}.sign.heart{background:#fbe1ec;border-radius:22px 22px 7px 7px}.sign.doodle{background:#fff3da;border:2px dashed #df9bb5;transform:rotate(-1deg)}.sign.bubble{border-radius:22px;background:#e9e0ff}.sign small{display:block;font-size:10px;opacity:.6;margin-bottom:2px}.sign .progress{height:3px;background:#d4c9d9;border-radius:5px;margin-top:6px;overflow:hidden}.sign .progress i{display:block;height:100%;background:#eb86b3;width:100%}.choices{display:flex;gap:4px;margin-top:6px}.choices button{flex:1;border:1px solid #8e9ac2;background:#fff;color:#25304b;border-radius:6px;min-height:35px;padding:5px 2px;font-size:12px;font-weight:700}.sign.ledsign .choices button{background:#dbe4ff}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding-bottom:4px}.action{background:linear-gradient(#3 <section id="home" class="screen active"><div class="top"><span></span><div><button class="iconbtn" onclick="showHelp()">ⓘ</button><button class="iconbtn" onclick="toggleMute()" id="muteHome">♫</button></div></div><div style="margin-top:20px"><div class="title">✧ 饭撒模拟器 ✧</div><div class="sub">IDOL FAN SERVICE SIMULATOR</div></div><div class="stage home-stage"><div class="led"></div><div class="platform"></div><div class="idol" id="idolHome"></div><div class="crowd"></div></div><div class="statbar"><span>♛ 历史最高分</span><strong class="pink" id="bestHome">0</strong></div><button class="btn" onclick="startShow()">▶ 开始演出</button><button class="btn secondary" onclick="go('customize')">形象搭配</button><button class="btn secondary small" onclick="openHistory()">演出记录</button><div class="foot">工位偶尔有云 PLAY LAB</div></section>

<script>
const A=[['fingerHeart','手指爱心','♡'],['bigHeart','比心','♥'],['wink','眨眼','◉'],['wave','挥手','✋'],['kiss','飞吻','♡'],['peace','剪刀手','✌'],['spin','转圈','↻'],['bow','鞠躬','⌒']];const lines={fingerHeart:['给我一颗小心心！','小心心快递签收！','手指爱心发射！'],bigHeart:['双手比个心！','给我比个超大心！','爱心举高高！'],wink:['给我一个 Wink！','Wink一下我就下班！','看到我就眨眼！'],wave:['这里这里！挥挥手！','前排请挥挥手！','看到我就挥挥手！'],kiss:['给我一个飞吻！','隔空飞吻请查收！','飞吻发射！'],peace:['今天也要比耶！','给我一个胜利V！','来个剪刀手！'],spin:['原地转一圈！','看到这牌转一圈！','转圈展示今日穿搭！'],bow:['给大家谢个幕！','来个优雅鞠躬！','向大家鞠个躬！']};const prefs=[['今天是猫猫派还是狗狗派？','猫猫','狗狗'],['今天走可爱风还是帅气风？','可爱','帅气'],['下次想染什么发色？','粉发','银发'],['演出结束想吃什么？','火锅','烤肉'],['今天更想喝什么？','咖啡','奶茶'],['下次舞台想挑战哪种风格？','清新','暗黑'],['休息日想做什么？','宅家','出门']];const math=[['519 + 1',520,519,521],['520 + 1',521,520,522],['1000 + 314',1314,1313,1315],['90 + 9',99,98,100],['7 + 7',14,13,15],['20 + 20',40,39,41]];const skins=['paper','ledsign','banner','heart','doodle','bubble'];const cats={发型:['短碎发','中分发','波波头','长直发','狼尾发','卷发'],发色:['黑色','深棕','银灰','奶金','淡紫','粉色'],上装:['银蓝外套','黑色夹克','白色衬衫','粉色卫衣'],下装:['白色长裤','深蓝长裤','黑色短裤','浅灰裙装'],鞋子:['白色运动鞋','黑色短靴','银色舞鞋'],配饰:['无','耳饰','发夹','帽子'],舞台:['银蓝舞台','紫色舞台','粉蓝舞台'],灯光:['冷白','银蓝','浅粉','紫蓝']};let look=JSON.parse(localStorage.getItem('fs-look')||'null')||{发型:0,发色:0,上装:0,下装:0,鞋子:0,配饰:0,舞台:0,灯光:0,name:''};let cat='发型',game=null,tick=null,spawnClock=0,elapsed=0,remaining=60,session=[],records=JSON.parse(localStorage.getItem('fs-records')||'[]'),best=JSON.parse(localStorage.getItem('fs-best')||'{"60":0,"80":0}'),muted=false,last=0,sceneLabels=[],nextEvent=0,comboQueue=null,comboIndex=0,comboFailed=false,stage=0,paused=false;const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>a+Math.random()*(b-a);function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));if(id==='home'){$('bestHome').textContent=Math.max(best[60]||0,best[80]||0).toLocaleString();renderIdols()}if(id==='customize'){renderCustom();$('idolName').value=look.name||''}}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),750)}function idolSvg(){let hairs=['#242638','#292a3d','#4a3c39','#d7c9b5','#b7aedb','#e8a6c7'],hair=hairs[look.发色]||hairs[0],coat=['#8ca8df','#333b56','#e3e5ed','#d8a3c5'][look.上装],pants=['#e3e8f2','#36466b','#272d45','#a3a4bc'][look.下装],shoe=['#f7f8ff','#22283b','#b6c3df'][look.鞋子];let long=[3,4,5].includes(look.发型);return `<svg viewBox="0 0 80 120" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="26" y="16" width="28" height="34" fill="${hair}"/><rect x="24" y="25" width="32" height="25" fill="${hair}"/>${long?`<rect x="19" y="30" width="10" height="42" fill="${hair}"/><rect x="51" y="30" width="10" height="42" fill="${hair}"/>`:''}<rect x="29" y="26" width="22" height="27" fill="#f4d6c9"/><rect x="27" y="13" width="27" height="18" fill="${hair}"/><rect x="25" y="19" width="13" height="16" fill="${hair}"/><rect x="31" y="37" width="4" height="4" fill="#24324e"/><rect x="45" y="37" width="4" height="4" fill="#24324e"/><rect x="38" y="46" width="5" height="2" fill="#c98895"/><rect x="35" y="53" width="10" height="8" fill="#efcdbf"/><rect x="24" y="61" width="32" height="31" fill="${coat}"/><rect x="35" y="62" width="10" height="28" fill="#f4f3f7"/><rect x="17" y="64" width="9" height="25" fill="${coat}"/><rect x="54" y="64" width="9" height="25" fill="${coat}"/><rect x="17" y="88" width="9" height="7" fill="#f4d6c9"/><rect x="54" y="88" width="9" height="7" fill="#f4d6c9"/><rect x="27" y="91" width="12" height="20" fill="${pants}"/><rect x="41" y="91" width="12" height="20" fill="${pants}"/><rect x="25" y="109" width="15" height="7" fill="${shoe}"/><rect x="40" y="109" width="15" height="7" fill="${shoe}"/><rect x="24" y="61" width="32" height="2" fill="#d8e4ff"/>${look.配饰===1?'<rect x="52" y="45" width="3" height="6" fill="#e4bbdd"/>':''}${look.配饰===2?'<rect x="47" y="18" width="9" height="4" fill="#f2a8cf"/>':''}${look.配饰===3?'<rect x="19" y="12" width="42" height="8" fill="#343c5c"/><rect x="26" y="5" width="28" height="12" fill="#343c5c"/>':''}</svg>`}function renderIdols(){['idolHome','idolCustom','idolGame'].forEach(id=>$(id).innerHTML=idolSvg())}function saveLook(){look.name=$('idolName').value;localStorage.setItem('fs-look',JSON.stringify(look));renderIdols()}function renderCustom(){$('tabs').innerHTML=Object.keys(cats).map(x=>`<button class="${cat===x?'on':''}" onclick="cat='${x}';renderCustom()">${x}</button>`).join('');$('options').innerHTML=cats[cat].map((x,i)=>`<button class="opt ${look[cat]===i?'on':''}" onclick="look['${cat}']=${i};saveLook();renderCustom()">${x}</button>`).join('');renderIdols()}function randomLook(){Object.keys(cats).forEach(c=>look[c]=Math.floor(Math.random()*cats[c].length));saveLook();renderCustom()}function resetLook(){Object.keys(cats).forEach(c=>look[c]=0);saveLook();renderCustom()}function makeActions(){$('actions').innerHTML=A.map(([id,name,sym])=>`<button class="action" onclick="action('${id}')"><span class="sym">${sym}</span><span>${name}</span></button>`).join('')}function startShow(){if(game&&$('between').classList.contains('active'))recordGame();clearInterval(tick);game={score:0,streak:0,maxCombo:0,perfect:0,good:0,miss:0,wrong:0,signs:[],encore:false,events:[],id:Date.now()};session.length=session.length;stage++;elapsed=0;remaining=60;spawnClock=0;last=performance.now();nextEvent=rand(12,22);comboQueue=null;comboIndex=0;sceneLabels=[];paused=false;go('playing');$('combo').style.display='none';$('eventTag').classList.remove('show');makeActions();renderIdols();renderHUD();renderSigns();tick=setInterval(loop,100);toast('第 '+stage+' 场 · 演出开始')}function startEncore(){game.encore=true;remaining=20;elapsed=0;spawnClock=0;last=performance.now();nextEvent=rand(4,9);comboQueue=null;comboIndex=0;go('playing');$('combo').style.display='none';tick=setInterval(loop,100);toast('ENCORE！')}function loop(){let now=performance.now(),dt=Math.min(.2,(now-last)/1000);last=now;if(paused)return;remaining-=dt;elapsed+=dt;spawnClock-=dt;for(const s of [...game.signs])if(s.until<=now){fail(s)}if(remaining<=0){remaining=0;endRound();return}if(elapsed>=nextEvent&&!comboQueue){triggerEvent();nextEvent=elapsed+rand(14,22)}if(spawnClock<=0){spawnClock=remaining<20?rand(.8,1.25):rand(1.15,1.85);spawnSign()}renderHUD();renderSigns()}function triggerEvent(){if(game.signs.length>3)return;const kinds=['全场比心','应援接力','Wink连发','三连饭撒'];let kind=pick(kinds);if(Math.random()<.7){kind=pick(['三连饭撒','Wink连发']);comboQueue=kind==='Wink连发'?['wink','wink','wink']:pick([['bigHeart','wink','kiss'],['fingerHeart','wave','peace'],['peace','spin','bigHeart'],['kiss','wink','fingerHeart']]);comboIndex=0;comboFailed=false;showCombo();}showEvent(kind);game.events.push(kind);if(game.events.length>2)game.events.shift()}function showEvent(label){$('eventTag').textContent=label;$('eventTag').classList.add('show');setTimeout(()=>$('eventTag').classList.remove('show'),1500)}function showCombo(){if(!comboQueue){$('combo').style.display='none';return}$('combo').style.display='block';$('combo').innerHTML='饭撒连招 · '+comboQueue.map((x,i)=>`<span style="color:${i===comboIndex?'#ffbbdb':i<comboIndex?'#9fe0c5':'#d0d8ef'}">${i+1} ${A.find(a=>a[0]===x)[1]}</span>`).join(' → ')}function spawnSign(){if(game.signs.length>=6)return;if(comboQueue){if(game.signs.some(s=>s.combo))return;addSign('action',comboQueue[comboIndex],true);return}let complex=game.signs.filter(s=>s.type!=='action');let r=Math.random(),type=r<.62?'action':r<.85?'pref':'math';if(type!=='action'&&(complex.length>=2||complex.some(s=>s.type===type)))type='action';addSign(type,type==='action'?pick(A)[0]:null,false)}function addSign(type,act,combo){let text='',options=[],correct=-1;if(type==='action')text=pick(lines[act]);else if(type==='pref'){let p=pick(prefs);text=p[0];options=[p[1],p[2]]}else{let m=pick(math);text=m[0]+' = ?';options=[m[1],m[2],m[3]].sort(()=>Math.random()-.5);correct=options.indexOf(m[1])}let duration=remaining<20?2.8:3.6;game.signs.push({id:Math.random().toString(36).slice(2),type,act,text,options,correct,combo,skin:pick(skins),until:performance.now()+duration*1000,total:duration})}function renderSigns(){let now=performance.now();$('signzone').innerHTML=game.signs.map(s=>`<div class="sign ${s.skin}" data-id="${s.id}"><small>${s.combo?'★ 连招 '+(comboIndex+1)+'/3':s.type==='pref'?'粉丝提问':s.type==='math'?'饭撒暗号':'饭撒请求'}</small>${s.text}${s.type==='action'?'':`<div class="choices">${s.options.map((o,i)=>`<button onclick="answer('${s.id}',${i})">${s.type==='pref'?['A ','B '][i]:''}${o}</button>`).join('')}</div>`}<div class="progress"><i style="width:${Math.max(0,100*(s.until-now)/(s.total*1000))}%"></i></div></div>`).join('')}function renderHUD(){$('score').textContent=game.score.toLocaleString();$('streak').textContent='×'+game.streak;$('timer').textContent='剩余时间 '+String(Math.floor(Math.max(0,remaining)/60)).padStart(2,'0')+':'+String(Math.ceil(Math.max(0,remaining)%60)).padStart(2,'0')}function addScore(perfect){game.streak++;game.maxCombo=Math.max(game.maxCombo,game.streak);let mult=Math.min(2,1+.1*Math.floor(game.streak/5));game.score+=Math.round((perfect?150:100)*mult);game[perfect?'perfect':'good']++;toast(perfect?'Perfect +'+Math.round(150*mult):'Good +'+Math.round(100*mult))}function miss(){game.score=Math.max(0,game.score-50);game.streak=0;toast('Miss -50')}function fail(s){game.signs=game.signs.filter(x=>x!==s);game.miss++;miss();if(s.combo){comboQueue=null;showCombo()}}function resolve(s,perfect){game.signs=game.signs.filter(x=>x!==s);addScore(perfect);if(s.combo&&comboQueue){comboIndex++;if(comboIndex>=comboQueue.length){if(!comboFailed){showEvent('连招完成！');sceneLabels.push('三连饭撒')}comboQueue=null}else showCombo();if(!comboQueue)showCombo()}renderSigns()}function action(act){if(!game||!$('playing').classList.contains('active'))return;let s=game.signs.filter(x=>x.type==='action'&&x.act===act).sort((a,b)=>a.until-b.until)[0];if(s){let perfect=s.until-performance.now()>s.total*1000-1000;resolve(s,perfect)}else if(game.signs.some(x=>x.type==='action')){game.wrong++;miss();if(comboQueue)comboFailed=true}else{toast('自由饭撒！')}let el=$('idolGame');el.classList.remove('anim');void el.offsetWidth;el.classList.add('anim')}function answer(id,i){let s=game.signs.find(x=>x.id===id);if(!s)return;if(s.type==='math'&&i!==s.correct){game.miss++;game.signs=game.signs.filter(x=>x!==s);miss()}else resolve(s,s.type==='math'&&s.until-performance.now()>s.total*1000-2000)}function stats(){let successes=game.perfect+game.good,attempts=successes+game.miss+game.wrong,accuracy=attempts?successes/attempts:0;return {accuracy,grade:accuracy>=.95?'S':accuracy>=.85?'A':accuracy>=.7?'B':'C',duration:game.encore?80:60}}function endRound(){clearInterval(tick);tick=null;game.signs=[];comboQueue=null;let st=stats();$('betweenGrade').textContent=st.grade;$('betweenScore').textContent=game.score.toLocaleString()+' 分';$('betweenAccuracy').textContent=(st.accuracy*100).toFixed(1)+'%';$('betweenCombo').textContent=game.maxCombo;$('betweenDuration').textContent=st.duration+'秒';$('betweenScene').textContent=sceneLabels.slice(-1)[0]||game.events.slice(-1)[0]||'随机饭撒';$('betweenText').textContent=game.encore?'Encore 完成！还想再来一场吗？':'台下还在喊 Encore！';$('encoreButton').style.display=game.encore?'none':'block';go('between');if(!game.encore){game.preEncore=JSON.parse(JSON.stringify({score:game.score,streak:game.streak,perfect:game.perfect,good:game.good,miss:game.miss,wrong:game.wrong}))}}function recordGame(){let st=stats();let r={score:game.score,grade:st.grade,accuracy:st.accuracy,duration:st.duration,perfect:game.perfect,good:game.good,miss:game.miss+game.wrong,maxCombo:game.maxCombo,events:game.events.slice(),time:new Date().toLocaleString()};records.unshift(r);records=records.slice(0,8);localStorage.setItem('fs-records',JSON.stringify(records));best[st.duration]=Math.max(best[st.duration]||0,game.score);localStorage.setItem('fs-best',JSON.stringify(best));session.push(r);return r}function finishSession(){let r=recordGame();$('resultGrade').textContent=r.grade;$('resultScore').textContent=r.score.toLocaleString();$('resultDuration').textContent=r.duration+'秒演出'+(r.duration===80?' · ENCORE':'');$('resultMetrics').innerHTML=[['准确率',(r.accuracy*100).toFixed(1)+'%'],['Perfect',r.perfect],['Good',r.good],['Miss',r.miss],['最高连击',r.maxCombo],['本场名场面',r.events.join('、')||'—']].map(([k,v])=>`<div class="metric"><span>${k}</span><b>${v}</b></div>`).join('');$('sessionInfo').textContent='本轮已完成 '+session.length+' 场';go('result')}function openHistory(){$('historyContent').innerHTML='<h3>最近8场演出</h3>'+(!records.length?'<p class="hint">还没有演出记录</p>':records.map(r=>`<div class="metric"><span>${r.time}<br><small>${r.duration}秒 · ${r.grade}级</small></span><b>${r.score.toLocaleString()}</b></div>`).join(''))+`<p class="hint">60秒最佳：${(best[60]||0).toLocaleString()}　80秒最佳：${(best[80]||0).toLocaleString()}</p>`;go('history')}function pauseGame(){if(!game)return;paused=true;showOverlay('演出暂停','暂停期间计时与出牌停止。','继续演出',()=>{paused=false;let delta=performance.now()-last;game.signs.forEach(s=>s.until+=delta);last=performance.now();hideOverlay()},'结束当前演出',()=>{clearInterval(tick);hideOverlay();go('home')})}function showHelp(){showOverlay('玩法说明','60秒内回应粉丝饭撒牌：动作牌点击对应按钮；偏好题A/B都可以；算术题选正确数字。结束后可继续下一场或 Encore 20秒。','知道了',hideOverlay,'返回',hideOverlay)}function toggleMute(){muted=!muted;toast(muted?'音效已关闭':'音效已开启（原型暂无音频）')}function showOverlay(title,desc,primary,fn,secondary,fn2){$('overlayTitle').textContent=title;$('overlayDesc').textContent=desc;$('overlayPrimary').textContent=primary;$('overlayPrimary').onclick=fn;$('overlaySecondary').textContent=secondary;$('overlaySecondary').onclick=fn2;$('overlay').classList.add('show')}function hideOverlay(){$('overlay').classList.remove('show')}function saveCard(){const r=records[0];if(!r)return;const c=document.createElement('canvas');c.width=750;c.height=1100;let x=c.getContext('2d');x.fillStyle='#111a32';x.fillRect(0,0,750,1100);x.textAlign='center';x.fillStyle='#f2a9cf';x.font='bold 48px sans-serif';x.fillText('我的饭撒成绩单',375,130);x.font='bold 220px Georgia';x.fillText(r.grade,375,420);x.font='bold 58px sans-serif';x.fillText(r.score.toLocaleString()+' 分',375,540);x.fillStyle='#f4f6ff';x.font='32px sans-serif';['准确率 '+(r.accuracy*100).toFixed(1)+'%','Perfect '+r.perfect+'   Good '+r.good+'   Miss '+r.miss,'最高连击 '+r.maxCombo,r.duration+'秒演出'].forEach((t,i)=>x.fillText(t,375,650+i*78));x.font='24px sans-serif';x.fillStyle='#b6c6ed';x.fillText('工位偶尔有云 PLAY LAB',375,1030);let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='饭撒成绩单.png';a.click();toast('已生成成绩单')}function shareCard(){toast('原型暂不调用小红书分享接口，请先保存成绩单')}document.addEventListener('visibilitychange',()=>{if(document.hidden&&game&&$('playing').classList.contains('active')&&!paused)pauseGame()});makeActions();renderIdols();go('home');
</script></body></html>
