/* V1.1 safe-area spacing: never collapse top/bottom margins on short phones */
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
#app{padding-top:calc(var(--safe-top) + 24px);padding-bottom:calc(var(--safe-bottom) + 28px)}
.screen{min-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 52px)}
@media(max-height:720px){#app{padding-top:calc(var(--safe-top) + 16px);padding-bottom:calc(var(--safe-bottom) + 20px)}.screen{min-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 36px)}}
@supports not (height:100dvh){#app{min-height:100vh}.screen{min-height:auto}}

<script>
const A=[['fingerHeart','手指爱心','♡'],['bigHeart','比心','♥'],['wink','眨眼','◉'],['wave','挥手','✋'],['kiss','飞吻','♡'],['peace','剪刀手','✌'],['spin','转圈','↻'],['bow','鞠躬','⌒']];const lines={fingerHeart:['给我一颗小心心！','小心心快递签收！','手指爱心发射！'],bigHeart:['双手比个心！','给我比个超大心！','爱心举高高！'],wink:['给我一个 Wink！','Wink一下我就下班！','看到我就眨眼！'],wave:['这里这里！挥挥手！','前排请挥挥手！','看到我就挥挥手！'],kiss:['给我一个飞吻！','隔空飞吻请查收！','飞吻发射！'],peace:['今天也要比耶！','给我一个胜利V！','来个剪刀手！'],spin:['原地转一圈！','看到这牌转一圈！','转圈展示今日穿搭！'],bow:['给大家谢个幕！','来个优雅鞠躬！','向大家鞠个躬！']};const prefs=[['今天是猫猫派还是狗狗派？','猫猫','狗狗'],['今天走可爱风还是帅气风？','可爱','帅气'],['下次想染什么发色？','粉发','银发'],['演出结束想吃什么？','火锅','烤肉'],['今天更想喝什么？','咖啡','奶茶'],['下次舞台想挑战哪种风格？','清新','暗黑'],['休息日想做什么？','宅家','出门']];const math=[['519 + 1',520,519,521],['520 + 1',521,520,522],['1000 + 314',1314,1313,1315],['90 + 9',99,98,100],['7 + 7',14,13,15],['20 + 20',40,39,41]];const skins=['paper','ledsign','banner','heart','doodle','bubble'];const cats={发型:['短碎发','中分发','波波头','长直发','狼尾发','卷发'],发色:['黑色','深棕','银灰','奶金','淡紫','粉色'],上装:['银蓝外套','黑色夹克','白色衬衫','粉色卫衣'],下装:['白色长裤','深蓝长裤','黑色短裤','浅灰裙装'],鞋子:['白色运动鞋','黑色短靴','银色舞鞋'],配饰:['无','耳饰','发夹','帽子'],舞台:['银蓝舞台','紫色舞台','粉蓝舞台'],灯光:['冷白','银蓝','浅粉','紫蓝']};let look=JSON.parse(localStorage.getItem('fs-look')||'null')||{发型:0,发色:0,上装:0,下装:0,鞋子:0,配饰:0,舞台:0,灯光:0,name:''};let cat='发型',game=null,tick=null,spawnClock=0,elapsed=0,remaining=60,session=[],records=JSON.parse(localStorage.getItem('fs-records')||'[]'),best=JSON.parse(localStorage.getItem('fs-best')||'{"60":0,"80":0}'),muted=false,last=0,sceneLabels=[],nextEvent=0,comboQueue=null,comboIndex=0,comboFailed=false,stage=0,paused=false;const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>a+Math.random()*(b-a);function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));if(id==='home'){$('bestHome').textContent=Math.max(best[60]||0,best[80]||0).toLocaleString();renderIdols()}if(id==='customize'){renderCustom();$('idolName').value=look.name||''}}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),750)}function idolSvg(){let hairs=['#242638','#332c3b','#4a3c39','#d7c9b5','#b7aedb','#e8a6c7'],hair=hairs[look.发色]||hairs[0],coat=['#8ca8df','#333b56','#e3e5ed','#d8a3c5'][look.上装],pants=['#e3e8f2','#36466b','#272d45','#a3a4bc'][look.下装],shoe=['#f7f8ff','#22283b','#b6c3df'][look.鞋子];let long=[3,4,5].includes(look.发型),wavy=[4,5].includes(look.发型);return `<svg viewBox="0 0 120 180" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${coat}"/><stop offset="1" stop-color="#273454"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe8dc"/><stop offset="1" stop-color="#eab9b4"/></linearGradient></defs><ellipse cx="60" cy="173" rx="31" ry="5" fill="#0b1125" opacity=".35"/><path d="M43 117L42 156 56 156 60 127 64 156 78 156 77 117Z" fill="${pants}" stroke="#27314c" stroke-width="2"/><path d="M41 153L55 153 56 168Q45 172 35 167Z M64 153L78 153 85 167Q74 172 63 168Z" fill="${shoe}" stroke="#667393" stroke-width="2"/><path d="M45 78Q27 79 23 91L14 125Q13 132 21 134L28 129 36 106 36 126Q60 135 84 126L84 106 92 129 99 134Q107 132 106 125L97 91Q93 79 75 78Z" fill="url(#jacket)" stroke="#222d4a" stroke-width="2.5"/><path d="M52 78L60 111 68 78 60 74Z" fill="#f7f2f8"/><path d="M37 83L49 91 58 116 47 105 40 113 M83 83L71 91 62 116 73 105 80 113" fill="none" stroke="#d5dafa" stroke-width="2"/><path d="M54 72L54 83Q60 89 66 83L66 72" fill="url(#skin)"/>${long?`<path d="M36 37Q22 49 27 91L38 102 45 70 77 70 82 101 94 91Q98 45 82 32Z" fill="${hair}" stroke="#24243b" stroke-width="2"/>`:''}<path d="M37 35Q36 18 60 17Q86 18 84 42L82 65Q78 83 60 86Q42 82 38 65Z" fill="url(#skin)" stroke="#b98d92" stroke-width="1.5"/><path d="M34 47Q26 22 45 15Q68 3 84 19Q95 30 85 51L81 39Q70 44 59 34Q48 48 38 46L38 59Z" fill="${hair}" stroke="#29263a" stroke-width="2"/><path d="M37 31Q52 12 72 22Q62 24 53 36L42 42Z" fill="${hair}" opacity=".85"/>${wavy?`<path d="M31 47Q21 63 31 85M88 47Q99 67 88 86" stroke="${hair}" stroke-width="10" fill="none" stroke-linecap="round"/>`:''}<path d="M45 55Q50 52 55 55 M66 55Q71 52 76 55" stroke="#3e3343" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="51" cy="59" rx="2.5" ry="3.6" fill="#252b40"/><ellipse cx="70" cy="59" rx="2.5" ry="3.6" fill="#252b40"/><circle cx="51.7" cy="57.8" r="1" fill="#fff"/><circle cx="70.7" cy="57.8" r="1" fill="#fff"/><path d="M57 68Q60 70 63 68" stroke="#bc7e8c" stroke-width="1.5" fill="none" stroke-linecap="round"/><ellipse cx="43" cy="66" rx="4" ry="2" fill="#efb5bb" opacity=".55"/><ellipse cx="77" cy="66" rx="4" ry="2" fill="#efb5bb" opacity=".55"/><path d="M15 126L20 137 26 133 28 126M92 126L94 133 100 137 105 126" fill="url(#skin)"/>${look.配饰===1?'<circle cx="84" cy="64" r="2.5" fill="#f3d5f0"/><circle cx="36" cy="64" r="2.5" fill="#f3d5f0"/>':''}${look.配饰===2?'<path d="M73 24L88 23 85 29 72 29Z" fill="#f4a9d0"/>':''}${look.配饰===3?'<path d="M30 25Q60 3 90 25L91 32 28 32Z" fill="#354464" stroke="#b1bee4" stroke-width="2"/>':''}</svg>`}function renderIdols(){['idolHome','idolCustom','idolGame'].forEach(id=>$(id).innerHTML=idolSvg())}function saveLook(){look.name=$('idolName').value;localStorage.setItem('fs-look',JSON.stringify(look));renderIdols()}function renderCustom(){$('tabs').innerHTML=Object.keys(cats).map(x=>`<button class="${cat===x?'on':''}" onclick="cat='${x}';renderCustom()">${x}</button>`).join('');$('options').innerHTML=cats[cat].map((x,i)=>`<button class="opt ${look[cat]===i?'on':''}" onclick="look['${cat}']=${i};saveLook();renderCustom()">${x}</button>`).join('');renderIdols()}function randomLook(){Object.keys(cats).forEach(c=>look[c]=Math.floor(Math.random()*cats[c].length));saveLook();renderCustom()}function resetLook(){Object.keys(cats).forEach(c=>look[c]=0);saveLook();renderCustom()}const gestureIcons={"fingerHeart":"<svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M9 25l-3-9q-1-4 3-5t5 4l2 5 4-7q2-3 5-1t0 5l-6 10z\"/><path d=\"M17 9q-4-5-7 0 2 4 7 6 5-2 7-6-3-5-7 0z\"/></svg>","bigHeart":"<svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M16 27C8 21 3 16 4 10Q5 3 12 6l4 4 4-4q7-3 8 4c1 6-4 11-12 17z\"/></svg>","wink":"<svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M3 16Q16 3 29 16Q16 29 3 16z\"/><circle cx=\"16\" cy=\"16\" r=\"6\"/><path d=\"M24 6l4-3M28 10l3-1\"/></svg>","wave":"<svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M8 27L5 16q0-3 3-3l4 5V6q0-3 3-2v11-9q0-3 3-2v11-8q0-3 3-2v10-5q0-3 3-2l1 10q0 7-7 9z\"/></svg>","kiss":"<svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M4 16q5-7 12-2 7-5 12 2-5 10-12 10T4 16z\"/><path d=\"M5 16q11 5 22 0\"/></svg>","peace":"<svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M10 27L4 10q-1-4 2-5t4 4l4 8-4-12q-1-4 2-5t4 4l5 13 3-5q3-3 5 0l-4 12q-4 7-15 3z\"/></svg>","spin":"<svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M26 12A11 11 0 0 0 7 8L4 12M6 20a11 11 0 0 0 19 4l3-4\"/><path d=\"M3 4v8h8M29 28v-8h-8\"/></svg>","bow":"<svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><circle cx=\"16\" cy=\"7\" r=\"4\"/><path d=\"M16 12l-5 10 5 5 5-5zM11 17L5 23M21 17l6 6\"/></svg>"};function makeActions(){$('actions').innerHTML=A.map(([id,name,sym])=>`<button class="action" onclick="action('${id}')"><span class="sym">${gestureIcons[id]||sym}</span><span>${name}</span></button>`).join('')}function startShow(){if(game&&$('between').classList.contains('active'))recordGame();clearInterval(tick);game={score:0,streak:0,maxCombo:0,perfect:0,good:0,miss:0,wrong:0,signs:[],encore:false,events:[],id:Date.now()};session.length=session.length;stage++;elapsed=0;remaining=60;spawnClock=0;last=performance.now();nextEvent=rand(12,22);comboQueue=null;comboIndex=0;sceneLabels=[];paused=false;go('playing');$('combo').style.display='none';$('eventTag').classList.remove('show');makeActions();renderIdols();renderHUD();renderSigns();tick=setInterval(loop,100);toast('第 '+stage+' 场 · 演出开始')}function startEncore(){game.encore=true;remaining=20;elapsed=0;spawnClock=0;last=performance.now();nextEvent=rand(4,9);comboQueue=null;comboIndex=0;go('playing');$('combo').style.display='none';tick=setInterval(loop,100);toast('ENCORE！')}function loop(){let now=performance.now(),dt=Math.min(.2,(now-last)/1000);last=now;if(paused)return;remaining-=dt;elapsed+=dt;spawnClock-=dt;for(const s of [...game.signs])if(s.until<=now){fail(s)}if(remaining<=0){remaining=0;endRound();return}if(elapsed>=nextEvent&&!comboQueue){triggerEvent();nextEvent=elapsed+rand(14,22)}if(game.signs.length<2&&remaining>2&&!comboQueue){while(game.signs.length<2)spawnSign();spawnClock=Math.min(spawnClock,2.7)}if(spawnClock<=0){spawnClock=elapsed<20?rand(2.8,3.6):elapsed<40?rand(2.5,3.2):rand(2.2,2.9);spawnSign()}renderHUD();renderSigns()}function triggerEvent(){if(game.signs.length>=4)return;const kinds=['全场比心','应援接力','Wink连发','三连饭撒'];let kind=pick(kinds);if(Math.random()<.7){kind=pick(['三连饭撒','Wink连发']);comboQueue=kind==='Wink连发'?['wink','wink','wink']:pick([['bigHeart','wink','kiss'],['fingerHeart','wave','peace'],['peace','spin','bigHeart'],['kiss','wink','fingerHeart']]);comboIndex=0;comboFailed=false;showCombo();}showEvent(kind);game.events.push(kind);if(game.events.length>2)game.events.shift()}function showEvent(label){$('eventTag').textContent=label;$('eventTag').classList.add('show');setTimeout(()=>$('eventTag').classList.remove('show'),1500)}function showCombo(){if(!comboQueue){$('combo').style.display='none';return}$('combo').style.display='block';$('combo').innerHTML='饭撒连招 · '+comboQueue.map((x,i)=>`<span style="color:${i===comboIndex?'#ffbbdb':i<comboIndex?'#9fe0c5':'#d0d8ef'}">${i+1} ${A.find(a=>a[0]===x)[1]}</span>`).join(' → ')}function spawnSign(){if(game.signs.length>=4)return;if(comboQueue){if(game.signs.some(s=>s.combo))return;addSign('action',comboQueue[comboIndex],true);return}let complex=game.signs.filter(s=>s.type!=='action');let r=Math.random(),type=r<.62?'action':r<.85?'pref':'math';if(type!=='action'&&(complex.length>=2||complex.some(s=>s.type===type)))type='action';addSign(type,type==='action'?pick(A)[0]:null,false)}function addSign(type,act,combo){let text='',options=[],correct=-1;if(type==='action')text=pick(lines[act]);else if(type==='pref'){let p=pick(prefs);text=p[0];options=[p[1],p[2]]}else{let m=pick(math);text=m[0]+' = ?';options=[m[1],m[2],m[3]].sort(()=>Math.random()-.5);correct=options.indexOf(m[1])}let duration=elapsed<20?15:elapsed<40?12:10;game.signs.push({id:Math.random().toString(36).slice(2),type,act,text,options,correct,combo,skin:pick(skins),until:performance.now()+duration*1000,total:duration})}let signRenderSignature='';function renderSigns(){let now=performance.now();let signature=game.signs.map(s=>s.id+':'+Math.max(0,Math.ceil((s.until-now)/1000))).join('|');if(signature===signRenderSignature)return;signRenderSignature=signature;$('signzone').innerHTML=game.signs.map(s=>`<div class="sign kind-${s.type} ${s.until-now<1800?'warning':''}" data-id="${s.id}"><small>${s.combo?'★ 连招 '+(comboIndex+1)+'/3':s.type==='pref'?'CHOICE · 粉丝提问':s.type==='math'?'QUIZ · 算术挑战':'GESTURE · 手势应援'}　<span class="remaining">${Math.max(0,Math.ceil((s.until-now)/1000))}s</span></small><div class="sign-text">${s.text}</div>${s.type==='action'?`<div class="sign-action">回应：${A.find(a=>a[0]===s.act)[1]}</div><div class="sign-hint">↓ 点击下方手势栏</div>`:`<div class="choices">${s.options.map((o,i)=>`<button onclick="answer('${s.id}',${i})">${s.type==='pref'?['YES · ','NO · '][i]:''}${o}</button>`).join('')}</div><div class="sign-hint">点击牌面选项${s.type==='pref'?' · 任选其一':' · 选择正确答案'}</div>`}<div class="progress"><i style="width:${Math.max(0,100*(s.until-now)/(s.total*1000))}%"></i></div></div>`).join('')}function renderHUD(){$('score').textContent=game.score.toLocaleString();$('streak').textContent='×'+game.streak;$('timer').textContent='剩余时间 '+String(Math.floor(Math.max(0,remaining)/60)).padStart(2,'0')+':'+String(Math.ceil(Math.max(0,remaining)%60)).padStart(2,'0')}function addScore(perfect){game.streak++;game.maxCombo=Math.max(game.maxCombo,game.streak);let mult=Math.min(2,1+.1*Math.floor(game.streak/5));game.score+=Math.round((perfect?150:100)*mult);game[perfect?'perfect':'good']++;toast(perfect?'Perfect +'+Math.round(150*mult):'Good +'+Math.round(100*mult))}function miss(){game.score=Math.max(0,game.score-50);game.streak=0;toast('Miss -50')}function fail(s){game.signs=game.signs.filter(x=>x!==s);game.miss++;miss();if(s.combo){comboQueue=null;showCombo()}}function resolve(s,perfect){game.signs=game.signs.filter(x=>x!==s);addScore(perfect);if(s.combo&&comboQueue){comboIndex++;if(comboIndex>=comboQueue.length){if(!comboFailed){showEvent('连招完成！');sceneLabels.push('三连饭撒')}comboQueue=null}else showCombo();if(!comboQueue)showCombo()}renderSigns()}function action(act){if(!game||!$('playing').classList.contains('active'))return;let s=game.signs.filter(x=>x.type==='action'&&x.act===act).sort((a,b)=>a.until-b.until)[0];if(s){let perfect=s.until-performance.now()>s.total*1000-4000;resolve(s,perfect)}else if(game.signs.some(x=>x.type==='action')){game.wrong++;miss();if(comboQueue)comboFailed=true}else{toast('自由饭撒！')}let el=$('idolGame');el.classList.remove('anim');void el.offsetWidth;el.classList.add('anim')}function answer(id,i){let s=game.signs.find(x=>x.id===id);if(!s)return;if(s.type==='math'&&i!==s.correct){game.miss++;game.signs=game.signs.filter(x=>x!==s);miss()}else resolve(s,s.type==='math'&&s.until-performance.now()>s.total*1000-4000)}function stats(){let successes=game.perfect+game.good,attempts=successes+game.miss+game.wrong,accuracy=attempts?successes/attempts:0;return {accuracy,grade:accuracy>=.95?'S':accuracy>=.85?'A':accuracy>=.7?'B':'C',duration:game.encore?80:60}}function endRound(){clearInterval(tick);tick=null;game.signs=[];comboQueue=null;let st=stats();$('betweenGrade').textContent=st.grade;$('betweenScore').textContent=game.score.toLocaleString()+' 分';$('betweenAccuracy').textContent=(st.accuracy*100).toFixed(1)+'%';$('betweenCombo').textContent=game.maxCombo;$('betweenDuration').textContent=st.duration+'秒';$('betweenScene').textContent=sceneLabels.slice(-1)[0]||game.events.slice(-1)[0]||'随机饭撒';$('betweenText').textContent=game.encore?'Encore 完成！还想再来一场吗？':'台下还在喊 Encore！';$('encoreButton').style.display=game.encore?'none':'block';go('between');if(!game.encore){game.preEncore=JSON.parse(JSON.stringify({score:game.score,streak:game.streak,perfect:game.perfect,good:game.good,miss:game.miss,wrong:game.wrong}))}}function recordGame(){let st=stats();let r={score:game.score,grade:st.grade,accuracy:st.accuracy,duration:st.duration,perfect:game.perfect,good:game.good,miss:game.miss+game.wrong,maxCombo:game.maxCombo,events:game.events.slice(),time:new Date().toLocaleString()};records.unshift(r);records=records.slice(0,8);localStorage.setItem('fs-records',JSON.stringify(records));best[st.duration]=Math.max(best[st.duration]||0,game.score);localStorage.setItem('fs-best',JSON.stringify(best));session.push(r);return r}function finishSession(){let r=recordGame();$('resultGrade').textContent=r.grade;$('resultScore').textContent=r.score.toLocaleString();$('resultDuration').textContent=r.duration+'秒演出'+(r.duration===80?' · ENCORE':'');$('resultMetrics').innerHTML=[['准确率',(r.accuracy*100).toFixed(1)+'%'],['Perfect',r.perfect],['Good',r.good],['Miss',r.miss],['最高连击',r.maxCombo],['本场名场面',r.events.join('、')||'—']].map(([k,v])=>`<div class="metric"><span>${k}</span><b>${v}</b></div>`).join('');$('sessionInfo').textContent='本轮已完成 '+session.length+' 场';go('result')}function openHistory(){$('historyContent').innerHTML='<h3>最近8场演出</h3>'+(!records.length?'<p class="hint">还没有演出记录</p>':records.map(r=>`<div class="metric"><span>${r.time}<br><small>${r.duration}秒 · ${r.grade}级</small></span><b>${r.score.toLocaleString()}</b></div>`).join(''))+`<p class="hint">60秒最佳：${(best[60]||0).toLocaleString()}　80秒最佳：${(best[80]||0).toLocaleString()}</p>`;go('history')}function pauseGame(){if(!game)return;paused=true;showOverlay('演出暂停','暂停期间计时与出牌停止。','继续演出',()=>{paused=false;let delta=performance.now()-last;game.signs.forEach(s=>s.until+=delta);last=performance.now();hideOverlay()},'结束当前演出',()=>{clearInterval(tick);hideOverlay();go('home')})}function showHelp(){showOverlay('玩法说明','60秒内回应粉丝饭撒牌：手势牌点击下方手势按钮；粉丝提问直接点牌内任一选项；算术题直接点牌内正确数字。开场15秒、中段12秒、后段10秒。结束后可继续下一场或 Encore 20秒。','知道了',hideOverlay,'返回',hideOverlay)}function toggleMute(){muted=!muted;toast(muted?'音效已关闭':'音效已开启（原型暂无音频）')}function showOverlay(title,desc,primary,fn,secondary,fn2){$('overlayTitle').textContent=title;$('overlayDesc').textContent=desc;$('overlayPrimary').textContent=primary;$('overlayPrimary').onclick=fn;$('overlaySecondary').textContent=secondary;$('overlaySecondary').onclick=fn2;$('overlay').classList.add('show')}function hideOverlay(){$('overlay').classList.remove('show')}function saveCard(){const r=records[0];if(!r)return;const c=document.createElement('canvas');c.width=750;c.height=1100;let x=c.getContext('2d');x.fillStyle='#111a32';x.fillRect(0,0,750,1100);x.textAlign='center';x.fillStyle='#f2a9cf';x.font='bold 48px sans-serif';x.fillText('我的饭撒成绩单',375,130);x.font='bold 220px Georgia';x.fillText(r.grade,375,420);x.font='bold 58px sans-serif';x.fillText(r.score.toLocaleString()+' 分',375,540);x.fillStyle='#f4f6ff';x.font='32px sans-serif';['准确率 '+(r.accuracy*100).toFixed(1)+'%','Perfect '+r.perfect+'   Good '+r.good+'   Miss '+r.miss,'最高连击 '+r.maxCombo,r.duration+'秒演出'].forEach((t,i)=>x.fillText(t,375,650+i*78));x.font='24px sans-serif';x.fillStyle='#b6c6ed';x.fillText('工位偶尔有云 PLAY LAB',375,1030);let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='饭撒成绩单.png';a.click();toast('已生成成绩单')}function shareCard(){toast('原型暂不调用小红书分享接口，请先保存成绩单')}document.addEventListener('visibilitychange',()=>{if(document.hidden&&game&&$('playing').classList.contains('active')&&!paused)pauseGame()});makeActions();renderIdols();go('home');
